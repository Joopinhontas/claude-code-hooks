<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'SF Mono','Menlo','Monaco','Consolas','Courier New',monospace; font-size: 13px; }</style>
    <clipPath id="cmd">
      <rect x="20" y="50" width="0" height="22">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.001;0.083;1" values="0;0;338;338" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Window background -->
  <rect width="700" height="290" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="700" height="34" rx="10" fill="#161b22"/>
  <rect y="10" width="700" height="24" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5.5" fill="#27c93f"/>

  <!-- Window title -->
  <text x="350" y="22" text-anchor="middle" font-size="12" fill="#8b949e">claude-code-hooks — bash</text>

  <!-- Content group with global fade-out -->
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.875;0.958;1" values="1;1;0;0" calcMode="linear"/>

    <!-- Typed command -->
    <text x="20" y="66" fill="#58a6ff" clip-path="url(#cmd)">$ claude "update app.py and clean imports"</text>

    <!-- Blinking cursor -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.115;0.116;1" values="1;1;0;0" calcMode="discrete"/>
      <rect y="53" width="8" height="14" fill="#c9d1d9">
        <animate attributeName="x" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.001;0.083;1" values="20;20;358;358" calcMode="linear"/>
        <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite"
          keyTimes="0;0.49;0.5;1" values="1;1;0;0" calcMode="discrete"/>
      </rect>
    </g>

    <!-- Writing app.py -->
    <text x="20" y="96" fill="#484f58" opacity="0"><tspan xml:space="preserve">  Writing app.py...</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.125;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- auto-backup -->
    <text x="20" y="116" fill="#3fb950" opacity="0"><tspan xml:space="preserve">  &#x2713; [auto-backup] app.py &#x2192; backups/2026-05-08/</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.167;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- Running dangerous command -->
    <text x="20" y="146" fill="#8b949e" opacity="0"><tspan xml:space="preserve">  Running: rm -rf ./temp/</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.233;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- Guard blocked -->
    <text x="20" y="166" fill="#f85149" opacity="0"><tspan xml:space="preserve">  &#x2717; [guard] Blocked &#x2014; rm -rf ./temp/</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.275;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- Confirmation -->
    <text x="20" y="186" fill="#484f58" opacity="0"><tspan xml:space="preserve">    &#x2192; Claude must confirm before retrying</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.317;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- Task complete -->
    <text x="20" y="230" fill="#3fb950" opacity="0"><tspan xml:space="preserve">  &#x2713; Task complete &#xB7; 1 file modified</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.417;1" values="0;1;1" calcMode="discrete"/></text>

    <!-- Notify -->
    <text x="20" y="250" fill="#58a6ff" opacity="0"><tspan xml:space="preserve">  &#x26A1; [notify] Discord message sent</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.458;1" values="0;1;1" calcMode="discrete"/></text>

  </g>
</svg>
